#!/usr/bin/env bash

color_1="#7aa2f7"
color_2="#3b4261" 
color_3="#16161e" 
color_4="#e0af68" 
color_5="#15161e" 
color_6="#a9b1d6" 

# --- Styles ---
set -g mode-style "fg=${color_1},bg=${color_2}"
set -g message-style "fg=${color_1},bg=${color_2}"
set -g message-command-style "fg=${color_1},bg=${color_2}"
set -g pane-border-style "fg=${color_2}"
set -g pane-active-border-style "fg=${color_1}"

# --- Status Bar Layout ---
set -g status "on"
set -g status-justify "centre" # 2. Centralized the tabs
set -g status-style "fg=${color_1},bg=${color_3}"
set -g status-left-length "100"
set -g status-right-length "100"

# --- Left Side (Session Name) ---
# Removed the  triangle; added simple space padding
set -g status-left "#[fg=${color_5},bg=${color_1},bold] #S "

# --- Right Side (Date/Time/Host) ---
# Removed  triangles and  separators; used clean background shifts
set -g status-right "#[fg=${color_1},bg=${color_3}] #{prefix_highlight} #[fg=${color_1},bg=${color_2}] %Y-%m-%d | %I:%M %p #[fg=${color_5},bg=${color_1},bold] #h "

if-shell '[ "$(tmux show-option -gqv "clock-mode-style")" == "24" ]' {
  set -g status-right "#[fg=${color_1},bg=${color_3}] #{prefix_highlight} #[fg=${color_1},bg=${color_2}] %Y-%m-%d | %H:%M #[fg=${color_5},bg=${color_1},bold] #h "
}

# --- Window/Tab Format ---
# 3. Format: number:name (e.g., 1:bash)
setw -g window-status-activity-style "underscore,fg=${color_6},bg=${color_3}"
setw -g window-status-separator " " # Added a space between tabs
setw -g window-status-style "NONE,fg=${color_6},bg=${color_3}"

# Inactive Tab
setw -g window-status-format "#[fg=${color_6},bg=${color_3}] #I:#W "

# Active Tab (Rectangle block)
setw -g window-status-current-format "#[fg=${color_1},bg=${color_2},bold] #I:#W "

# --- Plugins ---
set -g @prefix_highlight_output_prefix "#[fg=${color_3},bg=${color_4}] "
set -g @prefix_highlight_output_suffix " "
